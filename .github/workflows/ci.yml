name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1" # weekly RAG quality check

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt ruff pip-audit
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest tests/ -q
      - name: Dependency vulnerabilities
        # Advisory for now: the ML dependency tree is large. Make blocking once triaged.
        run: pip-audit -r requirements.txt
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: rag-doc-intel:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          tags: rag-frontend:ci
      - name: Scan API image (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: rag-doc-intel:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0" # report-only until the baseline is triaged
      - name: Validate compose file
        run: docker compose config -q
        env:
          API_KEYS: '{"ci":"ci"}'
          POSTGRES_PASSWORD: ci
          GROQ_API_KEY: ci

  # Spends Groq tokens and needs a secret, so it runs on main / manually / weekly,
  # never on pull requests from forks.
  rag-quality:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Evaluate retrieval + generation (RAGAS) with a quality gate
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CHROMA_PERSIST_DIR: ./data/chroma-ci
          AUTH_ENABLED: "false"
        run: |
          python scripts/evaluate.py eval_dataset/sample_qa.jsonl \
            --ingest eval_dataset/sample.pdf \
            --fail-under faithfulness=0.70 answer_relevancy=0.60
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: eval_results/
